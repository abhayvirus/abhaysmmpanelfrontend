# Render Static Site — ABHAYSMM Frontend (CRA)
# Docs: https://render.com/docs/static-sites
services:
  - type: web
    name: abhaysmm-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
